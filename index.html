
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jupiter Browser</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #15171c;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #20232b;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    color: #70a5ff;
    margin-right: 10px;
    white-space: nowrap;
}

button {
    background: #343945;
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

button:hover { background: #4b5364; }

#url {
    flex: 1;
    min-width: 50px;
    padding: 12px;
    border-radius: 25px;
    border: 1px solid #454b58;
    background: #111319;
    color: white;
    outline: none;
    font-size: 15px;
}

#url:focus { border-color: #70a5ff; }

#tabs {
    display: flex;
    gap: 5px;
    background: #191c23;
    padding: 7px 10px;
    overflow-x: auto;
}

.tab {
    padding: 10px 16px;
    background: #303541;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    white-space: nowrap;
}

.tab.active { background: #414754; }

#browser {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

#message {
    display: none;
    background: #282e3a;
    padding: 12px;
    color: #ffcc80;
    font-size: 13px;
}

@media(max-width:650px) {
    header { flex-wrap: wrap; }
    .logo { width: 100%; }
}
</style>
</head>

<body>

<header>
    <div class="logo">🪐 Jupiter Browser</div>

    <button onclick="goBack()" title="Back">←</button>
    <button onclick="goForward()" title="Forward">→</button>
    <button onclick="reload()" title="Reload">⟳</button>
    <button onclick="home()" title="Home">⌂</button>

    <input
        id="url"
        placeholder="Search Google or enter a website..."
        onkeydown="if(event.key==='Enter') navigate()"
    >

    <button onclick="navigate()">Go</button>
    <button onclick="newTab()" title="New tab">+</button>
</header>

<div id="tabs"></div>

<div id="message">
    Some websites block iframe viewing. If a website
    doesn't load, use Open in New Tab.
</div>

<iframe
    id="browser"
    src="https://www.google.com/webhp?igu=1"
    allow="fullscreen"
    referrerpolicy="no-referrer"
></iframe>

<script>
let tabs = [];
let currentTab = 0;

function createTab(url = "https://www.google.com/webhp?igu=1") {
    tabs.push({
        url,
        history: [url],
        historyIndex: 0
    });

    currentTab = tabs.length - 1;
    renderTabs();
    navigateTo(url);
}

function renderTabs() {
    const container = document.getElementById("tabs");
    container.innerHTML = "";

    tabs.forEach((tab, index) => {
        const el = document.createElement("div");
        el.className = "tab" +
            (index === currentTab ? " active" : "");

        el.textContent = "Tab " + (index + 1);

        el.onclick = () => {
            currentTab = index;
            renderTabs();
            navigateTo(tabs[index].url);
        };

        container.appendChild(el);
    });
}

function navigate() {
    let input = document.getElementById("url").value.trim();
    if (!input) return;

    let address;

    if (/^https?:\/\//i.test(input)) {
        address = input;
    } else if (input.includes(".") && !input.includes(" ")) {
        address = "https://" + input;
    } else {
        address = "https://www.google.com/search?q=" +
            encodeURIComponent(input);
    }

    const tab = tabs[currentTab];

    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(address);
    tab.historyIndex++;
    tab.url = address;

    navigateTo(address);
}

function navigateTo(url) {
    document.getElementById("url").value = url;
    document.getElementById("browser").src = url;
    document.getElementById("message").style.display = "block";
}

function goBack() {
    const tab = tabs[currentTab];

    if (tab.historyIndex > 0) {
        tab.historyIndex--;
        tab.url = tab.history[tab.historyIndex];
        navigateTo(tab.url);
    }
}

function goForward() {
    const tab = tabs[currentTab];

    if (tab.historyIndex < tab.history.length - 1) {
        tab.historyIndex++;
        tab.url = tab.history[tab.historyIndex];
        navigateTo(tab.url);
    }
}

function reload() {
    const frame = document.getElementById("browser");
    frame.src = frame.src;
}

function home() {
    tabs[currentTab].url = "https://www.google.com";
    tabs[currentTab].history.push("https://www.google.com");
    tabs[currentTab].historyIndex++;
    navigateTo("https://www.google.com");
}

function newTab() {
    createTab();
}

createTab();
</script>

</body>
</html>
